name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact merged publication commit to deploy
        required: false
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Record deployed commit
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify and build
        run: |
          npm test
          npm run check
          npm run build

      - name: Deploy production site
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=tsukiyo-short-stories --branch=main --commit-hash=${{ steps.revision.outputs.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark deployed stories as published in Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: npm run mark:published
