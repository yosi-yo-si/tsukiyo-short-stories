name: Sync approved Notion stories

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      retry_count:
        description: Automatic retries after main advances (maximum 2)
        default: "0"
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: notion-publish-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Record checked-out main
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Import approved stories
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: npm run sync:notion

      - name: Verify generated site
        run: |
          npm test
          npm run check
          npm run build

      - name: Open or update the approval pull request
        id: publication
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            content/stories.json
            stories/**/index.html
            index.html
            archive-date.html
            archive-title.html
          branch: automation/notion-publish
          delete-branch: true
          commit-message: "Publish approved Notion stories"
          title: "Publish approved Notion stories"
          body: |
            Notionで「公開先：月夜の短編集」「公開状態：公開承認」になった作品を取り込みました。

            - 公開タイトルだけを使用します
            - 制作タイトル、データベース名、内部メモは公開しません
            - 記事ファイルだけの変更で検証に成功すると、自動マージしてCloudflare Pagesへ公開します
          labels: automated-publish

      - name: Merge verified publication and start deployment
        id: merge
        if: steps.publication.outputs.pull-request-number != ''
        uses: actions/github-script@v7
        env:
          PUBLICATION_NUMBER: ${{ steps.publication.outputs.pull-request-number }}
          PUBLICATION_SHA: ${{ steps.publication.outputs.pull-request-head-sha }}
          CHECKED_OUT_MAIN_SHA: ${{ steps.revision.outputs.sha }}
          RETRY_COUNT: ${{ inputs.retry_count || '0' }}
        with:
          script: |
            const { mergeOrRetry } = await import(
              `file://${process.env.GITHUB_WORKSPACE}/scripts/publication-retry.mjs`
            );
            const result = await mergeOrRetry({
              github, context,
              number: Number(process.env.PUBLICATION_NUMBER),
              expectedSha: process.env.PUBLICATION_SHA,
              mainSha: process.env.CHECKED_OUT_MAIN_SHA,
              retryCount: Number(process.env.RETRY_COUNT)
            });
            core.setOutput('outcome', result.outcome);


      - name: Preserve synchronization report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: sync-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Report synchronization outcome
        if: always()
        env:
          SYNC_MONITOR_URL: ${{ secrets.SYNC_MONITOR_URL || vars.SYNC_MONITOR_URL }}
          SYNC_MONITOR_TOKEN: ${{ secrets.SYNC_MONITOR_TOKEN }}
          JOB_RESULT: ${{ job.status }}
          SYNC_OUTCOME: ${{ steps.merge.outputs.outcome || 'complete' }}
        run: node scripts/send-sync-report.mjs
